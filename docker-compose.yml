
services:
  postgres:
    image: postgres:17
    container_name: cab-booking-db
    environment:
      POSTGRES_DB: cab_booking_db
      POSTGRES_USER: cabapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabapp -d cab_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cab-booking-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cab_booking_db
      SPRING_DATASOURCE_USERNAME: cabapp
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

      APP_ADMIN_NAME: ${ADMIN_NAME:-}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_ADMIN_PHONE: ${ADMIN_PHONE:-}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cab-booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
